---
# Single source of truth for signature and public key sizes, in bytes.
# No size is hard-coded anywhere else in the repository.
#
# Every value was read in the cited text on the `accessed` date. Nothing is
# quoted from memory. A value that could not be verified is left out.
#
# Fields
#   name               variant identifier used across the bench
#   family             classical | ml-dsa | composite | fn-dsa | slh-dsa
#   jose_alg           value of the JWS "alg" header parameter
#   jwk_kty            JWK key type used to represent the public key
#   signature_bytes    size of the raw signature value carried in the JWS
#   signature_length   fixed | maximum (maximum: the encoding is variable
#                      and the cited text gives an upper bound; the bench
#                      calibrates on that bound)
#   public_key_bytes   size of the raw public key
#   status             final | draft (state of the text giving the sizes)
#   source             document, section and table for the sizes
#   jose_source        document and section registering `jose_alg`
#   note               optional remarks
schema_version: 1
accessed: "2026-11-16"

variants:
  # --- Classical baselines ---------------------------------------------------
  - name: ES256
    family: classical
    jose_alg: ES256
    jwk_kty: EC
    signature_bytes: 64
    signature_length: fixed
    public_key_bytes: 64
    status: final
    source: >-
      RFC 7518 (May 2015), Section 3.4: the JWS Signature value is the
      64-octet sequence R || S. Public key: Section 6.2.1, parameters "x"
      and "y", each of the full size of a P-256 coordinate (32 octets, raw
      x || y).
    jose_source: RFC 7518, Section 3.4

  - name: RS256
    family: classical
    jose_alg: RS256
    jwk_kty: RSA
    signature_bytes: 256
    signature_length: fixed
    public_key_bytes: 270
    status: final
    source: >-
      RFC 8017 (November 2016), Section 8.2.1: the signature is an octet
      string of length k, the length in octets of the RSA modulus; k = 256
      for the 2048-bit modulus used here (RFC 7518, Section 3.3 requires
      2048 bits or more). Public key: DER encoding of RSAPublicKey
      (RFC 8017, Appendix A.1.1) for a 2048-bit modulus and e = 65537.
    jose_source: RFC 7518, Section 3.3
    note: >-
      270 follows from the DER encoding rules, it is not printed in the RFC.
      A unit test checks it, and the signature size, against a freshly
      generated key.

