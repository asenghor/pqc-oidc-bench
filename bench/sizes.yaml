  # --- Composite ML-DSA (PQ/T hybrid) ----------------------------------------
  # The JOSE draft registers the algorithm names and delegates key and
  # signature serialization to draft-ietf-lamps-pq-composite-sigs-19, since
  # published as RFC 10073. Sizes are read in RFC 10073, Appendix A, Table 6,
  # whose values are identical to Table 4 of that draft -19. Values marked
  # with an asterisk there are maxima: the ECDSA component is a DER-encoded
  # Ecdsa-Sig-Value of variable length.
  - name: ML-DSA-44-ES256
    family: composite
    jose_alg: ML-DSA-44-ES256
    jwk_kty: AKP
    signature_bytes: 2492
    signature_length: maximum
    public_key_bytes: 1377
    status: final
    source: >-
      RFC 10073 (November 2026), Appendix A, Table 6, row
      id-MLDSA44-ECDSA-P256-SHA256.
    jose_source: >-
      draft-ietf-jose-pq-composite-sigs-06 (Internet-Draft, 20 October 2026),
      Sections 3 and 4.1, Table 4.

