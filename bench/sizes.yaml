  # --- FN-DSA ----------------------------------------------------------------
  # FIPS 206 was not published on the access date: it is not listed among the
  # FIPS publications of the NIST Computer Security Resource Center. The sizes
  # below come from the IETF draft that will register FN-DSA for JOSE, which
  # itself describes FIPS 206 as "expected to be published in late 2026 early
  # 2027". They are provisional and must be re-read in FIPS 206 once it is
  # published. The draft does not say whether the signature encoding is of
  # fixed length.
  - name: FN-DSA-512
    family: fn-dsa
    jose_alg: FN-DSA-512
    jwk_kty: AKP
    signature_bytes: 666
    signature_length: fixed
    public_key_bytes: 897
    status: draft
    source: >-
      draft-ietf-cose-falcon-05 (Internet-Draft, 1 November 2026),
      Section 1, Table 1.
    jose_source: draft-ietf-cose-falcon-05, Sections 3 and 4
    note: >-
      Provisional: FIPS 206 unpublished on the access date. `fixed` is the
      bench's reading of a table that gives a single value per parameter set.

