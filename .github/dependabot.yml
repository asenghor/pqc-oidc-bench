---
# The docker-compose, terraform and npm ecosystems will be added with the
# phases that create their directories.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directories:
      - /
      - /services/emitter
      - /services/echo
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /services/emitter
      - /services/echo
    schedule:
      interval: weekly
