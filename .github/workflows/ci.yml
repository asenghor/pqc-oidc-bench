---
name: ci

# Public repository: never pull_request_target, read-only token, actions
# pinned by commit SHA, images pinned by digest.
# No step touches AWS and no AWS credential is stored here.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f  # v8.30.1
  HADOLINT_IMAGE: hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d  # v2.15.1
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb  # 0.76.2

jobs:
  secrets:
    name: Secret detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the whole history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git --config .gitleaks.toml --redact --verbose .

  lint:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: make help
        run: make help
      - name: yamllint
        run: |
          pip install --quiet -r requirements-dev.txt
          yamllint --strict .
      - name: hadolint
        run: |
          mapfile -t files < <(git ls-files | grep -E '(^|/)Dockerfile(\.[A-Za-z0-9_-]+)?$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Dockerfile: step skipped."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "== $f"
            docker run --rm -i "$HADOLINT_IMAGE" < "$f"
          done
      - name: docker compose config
        run: |
          shopt -s nullglob
          files=(compose/docker-compose*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Compose stack: step skipped."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "== $f"
            docker compose -f compose/docker-compose.yml -f "$f" config --quiet
          done

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Find configurations
        id: tf
        run: |
          dirs=$(git ls-files 'terraform/**/*.tf' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          if [ -z "$dirs" ]; then echo "No .tf file: Terraform steps skipped."; fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        if: steps.tf.outputs.dirs != ''
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: terraform fmt
        if: steps.tf.outputs.dirs != ''
        run: terraform fmt -check -recursive -diff terraform
      - name: terraform validate
        if: steps.tf.outputs.dirs != ''
        env:
          TF_DIRS: ${{ steps.tf.outputs.dirs }}
        run: |
          for d in $TF_DIRS; do
            case "$d" in terraform/modules/*) continue ;; esac
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        if: steps.tf.outputs.dirs != ''
        with:
          tflint_version: v0.66.0
      - name: tflint
        if: steps.tf.outputs.dirs != ''
        run: tflint --chdir=terraform --recursive
      - name: trivy config
        if: steps.tf.outputs.dirs != ''
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$TRIVY_IMAGE" \
            config --exit-code 1 --severity HIGH,CRITICAL terraform

  python:
    name: Python unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: pytest
        run: |
          if ! git ls-files 'services/**/test_*.py' 'tests/**/test_*.py' | grep -q .; then
            echo "No Python test: step skipped."
            exit 0
          fi
          pip install --quiet -r requirements-dev.txt
          for r in services/*/requirements.txt; do pip install --quiet -r "$r"; done
          python -m pytest

  smoke:
    name: Local smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: make local-up && make smoke
        run: |
          if [ ! -f compose/docker-compose.yml ]; then
            echo "No Compose stack yet: step skipped."
            exit 0
          fi
          make local-up
          make smoke
      - name: make local-down
        if: always()
        run: |
          if [ -f compose/docker-compose.yml ]; then make local-down; fi
