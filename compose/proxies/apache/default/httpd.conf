# Apache httpd, default profile: minimal TLS reverse proxy.
# No size or limit directive (LimitRequest*, ...): every limit keeps its
# built-in default. Do not add one here; raised limits belong to the
# mitigated/ profile.

ServerRoot "/usr/local/apache2"
ServerName apache
Listen 8443
User daemon
Group daemon

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule http2_module modules/mod_http2.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

# The access log holds no URI and no header value other than the request
# identifier: both can carry tokens.
ErrorLog /proc/self/fd/2
LogFormat "%{%Y-%m-%dT%H:%M:%S%z}t request_id=%{X-Request-Id}i status=%>s" bench
CustomLog /proc/self/fd/1 bench

Protocols h2 http/1.1
SSLEngine on
SSLCertificateFile /certs/apache.crt
SSLCertificateKeyFile /certs/apache.key

SSLProxyEngine on
SSLProxyCACertificateFile /certs/ca.crt
SSLProxyVerify require
SSLProxyCheckPeerName on

# Role of this hop in the response: "proxied" when the request was handed to
# the proxy handler, "origin" when httpd produced the response itself.
Header always set X-Hop-Apache "origin"
Header always set X-Hop-Apache "proxied" "expr=%{HANDLER} =~ /^proxy/"

# Two-hop chains: /via/<name>/ goes to that intermediary, which sends it to
# the echo backend. The request target is never rewritten.
ProxyPass /via/nginx/ https://nginx:8443/via/nginx/
ProxyPass /via/haproxy/ https://haproxy:8443/via/haproxy/
ProxyPass /via/envoy/ https://envoy:8443/via/envoy/
ProxyPass /via/traefik/ https://traefik:8443/via/traefik/
ProxyPass / https://echo:8443/
