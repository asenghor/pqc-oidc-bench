# HAProxy, default profile: minimal TLS reverse proxy.
# No size or buffer setting (tune.*): every limit keeps its built-in default.
# Do not add one here; raised limits belong to the mitigated/ profile.

global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    # The log holds no URI and no header value other than the request
    # identifier: both can carry tokens.
    log-format "%[date,ltime(%Y-%m-%dT%H:%M:%S%z)] request_id=%[capture.req.hdr(0)] status=%ST"

# Upstream names are resolved at run time, through the Docker DNS, so that the
# start order of the containers does not matter.
resolvers docker
    nameserver dns 127.0.0.11:53

frontend bench
    bind :8443 ssl crt /certs/haproxy.pem alpn h2,http/1.1
    capture request header X-Request-Id len 64

    # Role of this hop in the response: "proxied" when a server answered,
    # "origin" when HAProxy produced the response itself.
    http-response set-header X-Hop-Haproxy proxied
    http-after-response set-header X-Hop-Haproxy origin unless { res.hdr(X-Hop-Haproxy) -m found }

    # Two-hop chains: /via/<name>/ goes to that intermediary, which sends it
    # to the echo backend. The request target is never rewritten.
    use_backend nginx if { path_beg /via/nginx/ }
    use_backend apache if { path_beg /via/apache/ }
    use_backend envoy if { path_beg /via/envoy/ }
    use_backend traefik if { path_beg /via/traefik/ }
    default_backend echo

backend echo
    server echo echo:8443 ssl verify required ca-file /certs/ca.crt sni str(echo) verifyhost echo resolvers docker init-addr none

backend nginx
    server nginx nginx:8443 ssl verify required ca-file /certs/ca.crt sni str(nginx) verifyhost nginx resolvers docker init-addr none

backend apache
    server apache apache:8443 ssl verify required ca-file /certs/ca.crt sni str(apache) verifyhost apache resolvers docker init-addr none

backend envoy
    server envoy envoy:8443 ssl verify required ca-file /certs/ca.crt sni str(envoy) verifyhost envoy resolvers docker init-addr none

backend traefik
    server traefik traefik:8443 ssl verify required ca-file /certs/ca.crt sni str(traefik) verifyhost traefik resolvers docker init-addr none
