# nginx, default profile: minimal TLS reverse proxy.
# No size, buffer or limit directive: every limit keeps its built-in default.
# Do not add one here; raised limits belong to the mitigated/ profile.

events {}

http {
    # Role of this hop in the response: "proxied" when an upstream answered,
    # "origin" when nginx produced the response itself.
    map $upstream_status $hop_role {
        ""      origin;
        default proxied;
    }
    add_header X-Hop-Nginx $hop_role always;

    # The access log holds no URI and no header value: both can carry tokens.
    log_format bench '$time_iso8601 request_id=$http_x_request_id status=$status '
                     'upstream_status=$upstream_status';
    access_log /dev/stdout bench;
    error_log /dev/stderr;

    # Upstream names are resolved when used, through the Docker DNS, so that
    # the start order of the containers does not matter.
    resolver 127.0.0.11;

    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_server_name on;

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /certs/nginx.crt;
        ssl_certificate_key /certs/nginx.key;

        # Two-hop chains: /via/<name>/ goes to that intermediary, which sends
        # it to the echo backend. The request target is never rewritten.
        location /via/apache/ {
            set $upstream https://apache:8443;
            proxy_pass $upstream;
        }
        location /via/haproxy/ {
            set $upstream https://haproxy:8443;
            proxy_pass $upstream;
        }
        location /via/envoy/ {
            set $upstream https://envoy:8443;
            proxy_pass $upstream;
        }
        location /via/traefik/ {
            set $upstream https://traefik:8443;
            proxy_pass $upstream;
        }
        location / {
            set $upstream https://echo:8443;
            proxy_pass $upstream;
        }
    }
}
